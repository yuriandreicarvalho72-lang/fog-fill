<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Régua (camada)</title>
    <style>
      html, body { margin: 0; width: 100%; height: 100%; background: transparent; overflow: hidden; cursor: crosshair; outline: none; user-select: none; }
      #hud { position: fixed; left: 50%; bottom: 18px; transform: translateX(-50%); display: flex; gap: 14px; padding: 7px 14px;
             background: rgba(17, 20, 24, .86); color: #e8eef5; border-radius: 999px; font: 12px/1.3 system-ui, "Segoe UI", Roboto, sans-serif;
             box-shadow: 0 4px 16px rgba(0,0,0,.35); pointer-events: none; white-space: nowrap; }
      #hud b { color: #ffb35a; font-weight: 600; }
      body.ending #hud { opacity: 0; transition: opacity .2s; }
    </style>
  </head>
  <body tabindex="0">
    <div id="hud">
      <span id="hud-move" hidden><b>Esquerdo</b> ponto · <b>Direito</b> mover · <b>Esc</b> cancelar · <b>Backspace</b> desfazer · <b>Roda</b> zoom</span>
      <span id="hud-grab" hidden><b>Segure</b> o token e arraste · <b>solte</b> para marcar · <b>Esquerdo</b> fora dele: novo ponto · <b>Direito</b> mover · <b>Esc</b> cancelar · <b>Backspace</b> desfazer</span>
      <span id="hud-measure" hidden><b>Esquerdo</b> ponto · <b>Direito</b> terminar · <b>Esc</b> cancelar · <b>Backspace</b> desfazer · <b>Roda</b> zoom</span>
    </div>
    <script type="module" src="./src/overlay.js"></script>
  </body>
</html>

<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <title>Cor da luz</title>
    <link rel="stylesheet" href="./src/style.css" />
  </head>
  <body class="embed">
    <div class="swatches" id="swatches"></div>
    <div class="row">
      <input id="color" type="color" value="#ff8a2a" title="Escolher cor" />
      <label class="grow">Intensidade <output id="o-int"></output>
        <input id="intensity" type="range" min="0.1" max="1" step="0.05" value="0.6" />
      </label>
    </div>
    <div class="row">
      <select id="anim" class="grow" title="Animação"></select>
    </div>
    <div class="row">
      <label class="grow">Velocidade <output id="o-speed"></output>
        <input id="speed" type="range" min="0.25" max="3" step="0.05" value="1" />
      </label>
    </div>
    <div class="row">
      <button id="clear" type="button">Sem cor (luz branca)</button>
    </div>
    <script type="module" src="./src/context.js"></script>
  </body>
</html>

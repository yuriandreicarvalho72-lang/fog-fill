<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Arsenal</title>
    <link rel="stylesheet" href="./src/style.css" />
  </head>
  <body>
    <main>
      <h1>Arsenal</h1>
      <div id="shooter" data-pg="*"></div>
      <section id="destr" data-pg="Principal" hidden></section>
      <section id="weapons" data-pg="Principal"></section>
      <section id="fire" data-pg="Principal"></section>
      <section id="charges" data-pg="Principal"></section>
      <section>
        <h2>Adicionar arma</h2>
        <input type="text" id="q" placeholder="Buscar no catálogo (nome, categoria, apelido…)" />
        <div id="results"></div>
        <details>
          <summary>Criar arma própria</summary>
          <div id="custom"></div>
        </details>
      </section>
      <section data-pg="Aparência">
        <details>
          <summary>Aparência</summary>
          <div id="config"></div>
        </details>
      </section>
    </main>
    <script type="module" src="./src/panel.js"></script>
  </body>
</html>

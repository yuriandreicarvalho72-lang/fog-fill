# Compila as três extensões e publica no GitHub Pages:
#   /fog-fill/                 Balde de Fog
#   /fog-fill/luz-colorida/    Luz Colorida
#   /fog-fill/regua/           Régua
# Roda sozinho a cada mudança em extensoes/ (ou pelo botão "Run workflow" na aba Actions).
name: Publicar extensões

on:
  push:
    branches: [main]
    paths: ["extensoes/**", ".github/workflows/publicar.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Compilar
        run: |
          set -e
          for p in balde-de-fog luz-colorida regua; do
            (cd extensoes/$p && npm ci --no-audit --no-fund && npm run build)
          done
          mkdir -p _site/luz-colorida _site/regua
          cp -r extensoes/balde-de-fog/dist/. _site/
          cp -r extensoes/luz-colorida/dist/. _site/luz-colorida/
          cp -r extensoes/regua/dist/. _site/regua/
          touch _site/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4

# Compila TODAS as extensões da pasta extensoes/ e publica no GitHub Pages:
#   extensoes/balde-de-fog  ->  /fog-fill/            (raiz)
#   extensoes/<nome>        ->  /fog-fill/<nome>/     (ex.: luz-colorida, regua, clima)
# Extensão nova = só criar a pasta em extensoes/. Não precisa mexer mais neste arquivo.
name: Publicar extensões

on:
  push:
    branches: [main]
    paths: ["extensoes/**", ".github/workflows/publicar.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Compilar
        run: |
          set -e
          mkdir -p _site
          for dir in extensoes/*/; do
            p=$(basename "$dir")
            echo "::group::$p"
            if [ -f "$dir/package-lock.json" ]; then (cd "$dir" && npm ci --no-audit --no-fund); else (cd "$dir" && npm install --no-audit --no-fund); fi
            (cd "$dir" && npm run build)
            if [ "$p" = "balde-de-fog" ]; then cp -r "$dir/dist/." _site/; else mkdir -p "_site/$p" && cp -r "$dir/dist/." "_site/$p/"; fi
            echo "::endgroup::"
          done
          touch _site/.nojekyll
          ls _site
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4

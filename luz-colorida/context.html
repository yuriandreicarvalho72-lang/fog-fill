<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <title>Cor da luz</title>
    <script type="module" crossorigin src="/fog-fill/luz-colorida/assets/context-DxQgkdw1.js"></script>
    <link rel="modulepreload" crossorigin href="/fog-fill/luz-colorida/assets/shared-XAn_tuje.js">
    <link rel="stylesheet" crossorigin href="/fog-fill/luz-colorida/assets/style-B7QTnHMN.css">
  </head>
  <body class="embed">
    <div class="swatches" id="swatches"></div>
    <div class="row">
      <input id="color" type="color" value="#ff8a2a" title="Escolher cor" />
      <label class="grow">Intensidade <output id="o-int"></output>
        <input id="intensity" type="range" min="0.1" max="1" step="0.05" value="0.6" />
      </label>
    </div>
    <div class="row">
      <button id="clear" type="button">Sem cor (luz branca)</button>
    </div>
  </body>
</html>
